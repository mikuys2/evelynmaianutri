<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | Evelyn Maia</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e8dcd5">
<link rel="icon" type="image/png" href="/img/logo-favicon.png">
<style>
@font-face{font-family:"Playfair Display";src:url("/fonts/playfair-latin.woff2") format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Raleway";src:url("/fonts/raleway-latin.woff2") format("woff2");font-weight:400 700;font-display:swap}
:root{--blush:#e8dcd5;--ink:#2b2523;--ink-2:#5b504b;--salvia-deep:#3d5c59;--salvia-ink:#2f4846;--ease-out:cubic-bezier(.23,1,.32,1);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:var(--blush);color:var(--ink);font:450 17px/1.65 "Raleway",system-ui,sans-serif;font-variant-numeric:lining-nums;padding:32px 16px;text-align:center}
main{max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px}
img{width:72px;height:auto}
h1{font:500 clamp(2rem,6vw,2.8rem)/1.15 "Playfair Display",Georgia,serif;letter-spacing:-.015em;margin:8px 0 0;text-wrap:balance}
p{margin:0;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px;align-items:center;margin-top:10px}
.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 1.6em;border-radius:999px;background:var(--salvia-deep);color:#fff;font-weight:600;text-decoration:none;transition:transform 160ms var(--ease-out),background-color 200ms ease}
.btn:active{transform:scale(.97)}
.link{font-weight:600;color:var(--salvia-ink);text-underline-offset:.3em}
:focus-visible{outline:2px solid var(--salvia-deep);outline-offset:3px;border-radius:6px}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--salvia-ink)}}
</style>
</head>
<body>
<main>
  <img src="/img/logo-mark.png" width="256" height="225" alt="">
  <h1>Esta página não existe mais</h1>
  <p>O endereço pode ter mudado com o novo site. Todo o conteúdo está na página inicial.</p>
  <div class="actions">
    <a class="btn" href="/">Ir para a página inicial</a>
    <a class="link" href="https://wa.me/5531983033462?text=Ol%C3%A1%2C%20Evelyn!%20Vim%20pelo%20site%20e%20gostaria%20de%20agendar%20uma%20consulta.">Agendar consulta</a>
  </div>
</main>
</body>
</html>
